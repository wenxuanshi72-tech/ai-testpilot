[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-testpilot-workspace"
version = "0.1.0"
description = "Shared Python tooling and dependency boundaries for AI TestPilot."
requires-python = ">=3.11,<3.12"
dependencies = []

[project.optional-dependencies]
sut-backend = [
  "Flask>=3.1,<4",
  "Flask-Cors>=5,<7",
  "Flask-Migrate>=4.1,<5",
  "Flask-SQLAlchemy>=3.1,<4",
]
plugin-backend = [
  "Flask>=3.1,<4",
  "Flask-Cors>=5,<7",
  "SQLAlchemy>=2.0,<3",
  "jsonschema>=4.23,<5",
  "pydantic>=2.11,<3",
]
test = [
  "httpx>=0.28,<1",
  "playwright>=1.50,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
]
quality = [
  "mypy>=1.15,<2",
  "ruff>=0.11,<1",
  "types-jsonschema>=4.23,<5",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
minversion = "8.3"
testpaths = ["tests", "sut/backend/tests", "plugin/backend/tests"]
xfail_strict = true

[tool.coverage.run]
branch = true
relative_files = true
source = ["sut/backend", "plugin/backend"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
src = ["sut/backend", "plugin/backend", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["S101"]

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
line-ending = "lf"
quote-style = "double"

[tool.mypy]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
python_version = "3.11"
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
